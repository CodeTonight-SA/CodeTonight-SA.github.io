<!-- happi:live --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" role="img"
  font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="none"
  aria-label="The open-core boundary. Open and free to clone today: the HAPPI/1.5 protocol and GRASP under AGPL-3.0. Used internally and by a small number of organisations while the release is prepared: HAL and GRIP."><!-- /happi:live -->
  <!-- Left of the line is open and clone-able today. Right of it is not yet.
       Orange marks what is open; grey marks what is not. Sharp corners only. -->

  <text x="8" y="24" fill="#f97316" font-size="12" font-weight="700" letter-spacing="1.5">OPEN &#8212; CLONE IT TODAY</text>
  <text x="424" y="24" fill="#a3a3a3" font-size="12" font-weight="700" letter-spacing="1.5">NOT YET OPEN</text>

  <rect x="8" y="44" width="180" height="76" stroke="#f97316" stroke-width="2"/>
  <text x="98" y="80" fill="#f97316" font-size="19" font-weight="700" text-anchor="middle"><!-- happi:live -->HAPPI/1.5<!-- /happi:live --></text>
  <text x="98" y="104" fill="#a3a3a3" font-size="12" text-anchor="middle">the protocol</text>

  <rect x="204" y="44" width="180" height="76" stroke="#f97316" stroke-width="2"/>
  <text x="294" y="80" fill="#f97316" font-size="19" font-weight="700" text-anchor="middle">GRASP</text>
  <text x="294" y="104" fill="#a3a3a3" font-size="12" text-anchor="middle">AGPL-3.0</text>

  <line x1="404" y1="14" x2="404" y2="196" stroke="#6a6a6a" stroke-width="1" stroke-dasharray="5 5"/>

  <rect x="424" y="44" width="164" height="76" stroke="#6a6a6a" stroke-width="2"/>
  <text x="506" y="80" fill="#e8e8ea" font-size="19" font-weight="700" text-anchor="middle">HAL</text>
  <text x="506" y="104" fill="#a3a3a3" font-size="12" text-anchor="middle">reaches any model</text>

  <rect x="604" y="44" width="164" height="76" stroke="#6a6a6a" stroke-width="2"/>
  <text x="686" y="80" fill="#e8e8ea" font-size="19" font-weight="700" text-anchor="middle">GRIP</text>
  <text x="686" y="104" fill="#a3a3a3" font-size="12" text-anchor="middle">the working engine</text>

  <text x="8" y="156" fill="#a3a3a3" font-size="13">Yours to take, run and fork today.</text>
  <text x="8" y="176" fill="#a3a3a3" font-size="13">Nothing here calls us to work.</text>

  <text x="424" y="156" fill="#a3a3a3" font-size="13">Used internally and by a small number of</text>
  <text x="424" y="176" fill="#a3a3a3" font-size="13">organisations while release is prepared.</text>
</svg>
