<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200"
  font-family="ui-monospace,'JetBrains Mono',monospace" fill="none" role="img"
  aria-label="The open-core seam. Open and free: HAPPI/1.3, and GRASP under AGPL-3.0. By invitation while the open-source release is in preparation: HAL and GRIP.">
  <!-- The open-core seam. Left of the seam is open and clone-able today; right
       of it is by invitation while the OSS release is prepared. Cyan = open,
       grey = by invite. -->

  <!-- group headings -->
  <text x="8" y="24" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1.5">OPEN — CLONE IT TODAY</text>
  <text x="400" y="24" fill="#8a8a8a" font-size="12" font-weight="700" letter-spacing="1.5">BY INVITE</text>

  <!-- OPEN side -->
  <rect x="8" y="40" width="170" height="80" rx="10" stroke="#22d3ee" stroke-width="2" />
  <text x="93" y="74" fill="#22d3ee" font-size="19" font-weight="700" text-anchor="middle">HAPPI/1.3</text>
  <text x="93" y="98" fill="#7a8a99" font-size="12" text-anchor="middle">[ open · free ]</text>

  <rect x="190" y="40" width="170" height="80" rx="10" stroke="#22d3ee" stroke-width="2" />
  <text x="275" y="74" fill="#22d3ee" font-size="19" font-weight="700" text-anchor="middle">GRASP</text>
  <text x="275" y="98" fill="#7a8a99" font-size="12" text-anchor="middle">[ open · AGPL-3.0 ]</text>

  <!-- the seam itself -->
  <path d="M380 30 V130" stroke="#525252" stroke-width="2" stroke-dasharray="5 5" />

  <!-- BY-INVITE side -->
  <rect x="400" y="40" width="170" height="80" rx="10" stroke="#8a8a8a" stroke-width="2" />
  <text x="485" y="74" fill="#8a8a8a" font-size="19" font-weight="700" text-anchor="middle">HAL</text>
  <text x="485" y="98" fill="#7a8a99" font-size="12" text-anchor="middle">[ by invite ]</text>

  <rect x="582" y="40" width="170" height="80" rx="10" stroke="#8a8a8a" stroke-width="2" />
  <text x="667" y="74" fill="#8a8a8a" font-size="19" font-weight="700" text-anchor="middle">GRIP</text>
  <text x="667" y="98" fill="#7a8a99" font-size="12" text-anchor="middle">[ by invite ]</text>

  <!-- direction of travel: the seam is moving, and we say so -->
  <path d="M400 150 H752" stroke="#525252" stroke-width="1" stroke-dasharray="3 4" />
  <text x="576" y="172" fill="#7a8a99" font-size="12" text-anchor="middle">open-source release in preparation</text>
</svg>
