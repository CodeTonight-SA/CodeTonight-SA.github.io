<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
  aria-label="CodeTonight — we license the AI engine, and open-source the tools around it. Deeds, not words.">
  <defs>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- canvas: matches the swiss-dark theme background -->
  <rect width="1200" height="630" fill="#0a0a0a" />

  <!-- accent seam, top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#seam)" />

  <!-- wordmark -->
  <text x="88" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="82"
    font-weight="700" fill="#e5e5e5" letter-spacing="-2">CodeTonight</text>

  <!-- positioning line -->
  <text x="88" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38"
    font-weight="400" fill="#e5e5e5">an open standard, an open proof layer,</text>
  <text x="88" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38"
    font-weight="400" fill="#8a8a8a">and an engine you can ask into.</text>

  <!-- product row, monospace -->
  <text x="88" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="25"
    fill="#22d3ee">HAPPI/1.3</text>
  <text x="248" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="25"
    fill="#525252">·</text>
  <text x="278" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="25"
    fill="#22d3ee">GRASP</text>
  <text x="390" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="25"
    fill="#525252">·</text>
  <text x="420" y="440" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="25"
    fill="#22d3ee">GRIP + HAL</text>

  <!-- rule -->
  <rect x="88" y="490" width="1024" height="1" fill="#262626" />

  <!-- footer -->
  <text x="88" y="545" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26"
    font-weight="700" fill="#e5e5e5">Deeds, not words.</text>
  <text x="1112" y="545" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="24" fill="#8a8a8a">Cape Town, South Africa</text>
</svg>
